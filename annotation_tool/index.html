<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>폭력 어노테이터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

  /* ── 상단 툴바 ── */
  #toolbar {
    background: #2a2a2a;
    border-bottom: 1px solid #444;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #toolbar button {
    background: #3a3a3a; color: #eee; border: 1px solid #555;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #4a4a4a; }
  #toolbar input[type=text] {
    background: #111; color: #eee; border: 1px solid #555;
    padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 280px;
  }
  #movie-select {
    background: #111; color: #eee; border: 1px solid #555;
    padding: 5px 8px; border-radius: 4px; font-size: 13px;
  }
  #toolbar .sep { width: 1px; background: #555; height: 24px; }
  #frame-counter { font-size: 13px; color: #aaa; margin-left: auto; }

  /* ── 메인 레이아웃 ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── 영상 영역 ── */
  #viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    position: relative;
    padding: 12px;
  }
  #frame-img {
    max-width: 100%;
    max-height: calc(100vh - 220px);
    object-fit: contain;
    border: 2px solid #333;
  }
  #status-bar {
    position: absolute;
    bottom: 70px;
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: #aaa;
  }
  #status-bar .active-label {
    font-weight: bold;
    font-size: 15px;
  }
  .label-violence { color: #ff4444; }
  .label-neg_hard { color: #ff9933; }
  .label-none { color: #888; }

  /* ── 타임라인 ── */
  #timeline-wrap {
    flex-shrink: 0;
    background: #1e1e1e;
    padding: 8px 12px;
    border-top: 1px solid #333;
  }
  #timeline {
    width: 100%;
    height: 24px;
    background: #2a2a2a;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .tl-segment {
    position: absolute;
    height: 100%;
    opacity: 0.85;
    border-radius: 2px;
  }
  .tl-cursor {
    position: absolute;
    width: 2px;
    height: 100%;
    background: #fff;
    pointer-events: none;
    top: 0;
  }
  #nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 6px;
  }
  #nav-bar button {
    background: #3a3a3a; color: #eee; border: 1px solid #555;
    padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  #nav-bar button:hover { background: #4a4a4a; }
  #frame-input {
    background: #111; color: #eee; border: 1px solid #555;
    padding: 3px 6px; border-radius: 4px; width: 70px;
    text-align: center; font-size: 13px;
  }

  /* ── 우측 패널 ── */
  #panel {
    width: 260px;
    background: #222;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #panel h3 {
    font-size: 13px;
    color: #aaa;
    padding: 10px 12px 6px;
    border-bottom: 1px solid #333;
  }
  #scene-list { flex: 1; padding: 6px; }
  .scene-item {
    background: #2a2a2a;
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 5px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .scene-item:hover { background: #333; }
  .scene-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-violence { background: #ff4444; }
  .dot-neg_hard { background: #ff9933; }
  .scene-item .del-btn {
    margin-left: auto;
    color: #666;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .scene-item .del-btn:hover { color: #ff4444; }

  /* ── 키보드 가이드 ── */
  #keybinds {
    padding: 10px 12px;
    border-top: 1px solid #333;
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }
  #keybinds kbd {
    background: #333; border: 1px solid #555;
    border-radius: 3px; padding: 1px 5px; font-size: 11px; color: #ccc;
  }
  #save-status {
    padding: 8px 12px;
    font-size: 12px;
    color: #888;
    text-align: center;
    border-top: 1px solid #333;
  }
</style>
</head>
<body>

<!-- 툴바 -->
<div id="toolbar">
  <span style="font-weight:bold; color:#ccc; font-size:14px;">폭력 어노데이터</span>
  <div class="sep"></div>

  <!-- mp4 → 자동 추출 -->
  <input type="text" id="video-path-input" placeholder="mp4 파일 경로 입력 (예: /path/to/movie.mp4)">
  <button onclick="extractFrames()">▶ mp4 선택 → 자동 추출</button>
  <div class="sep"></div>

  <!-- 기존 영화 선택 -->
  <select id="movie-select" onchange="loadMovie(this.value)">
    <option value="">-- 경로로 추출 --</option>
    {% for m in movies %}
    <option value="{{ m }}">{{ m }}</option>
    {% endfor %}
  </select>
  <button onclick="saveAnnotations()">💾 저장 (bt 생성)</button>
  <span id="frame-counter">frame -- / --</span>
</div>

<!-- 메인 -->
<div id="main">

  <!-- 뷰어 -->
  <div id="viewer">
    <img id="frame-img" src="" alt="프레임을 로드하세요">
    <div id="status-bar">
      <span id="active-label-display" class="active-label label-none">대기 중</span>
      <span style="margin-left:12px;" id="hint-text">① violence 시작 → 다시 ① 끝 &nbsp;|&nbsp; ② neg_hard 시작 → 다시 ② 끝</span>
    </div>
  </div>

  <!-- 우측 패널 -->
  <div id="panel">
    <h3 id="scene-count-title">📋 어노테이션 — 0개</h3>
    <div id="scene-list"></div>
    <div id="keybinds">
      <b style="color:#aaa">단축키</b><br>
      <kbd>←</kbd> / <kbd>→</kbd> 프레임 이동<br>
      <kbd>Shift</kbd>+<kbd>←/→</kbd> 10프레임<br>
      <kbd>1</kbd> violence 시작/끝<br>
      <kbd>2</kbd> neg_hard 시작/끝<br>
      <kbd>Esc</kbd> 진행 중 구간 취소<br>
      <kbd>Ctrl</kbd>+<kbd>S</kbd> 저장<br>
      표시 안 한 구간은 저장 시 neg_easy 자동 채움
    </div>
    <div id="save-status">저장 안 됨</div>
  </div>
</div>

<!-- 타임라인 -->
<div id="timeline-wrap">
  <div id="timeline" onclick="timelineClick(event)">
    <div class="tl-cursor" id="tl-cursor"></div>
  </div>
  <div id="nav-bar">
    <button onclick="go(-10)">◀◀ -10</button>
    <button onclick="go(-1)">◀ 이전</button>
    <input type="number" id="frame-input" value="1" min="1" onchange="jumpToFrame(this.value)">
    <button onclick="go(1)">다음 ▶</button>
    <button onclick="go(10)">+10 ▶▶</button>
  </div>
</div>

<script>
// ── 상태 ──────────────────────────────────────────
let currentMovie = "";
let frames = [];
let currentIdx = 0;
let scenes = [];      // { start_frame, end_frame, label }
let pendingLabel = null;   // 'violence' | 'neg_hard' | null
let pendingStart = null;

// ── 영화 로드 ──────────────────────────────────────
async function loadMovie(movieId) {
  if (!movieId) return;
  currentMovie = movieId;
  pendingLabel = null; pendingStart = null;
  updateActiveLabel();

  const r = await fetch(`/api/frames/${movieId}`);
  const d = await r.json();
  frames = d.frames;
  currentIdx = 0;

  const ann = await fetch(`/api/annotations/${movieId}`);
  const ad = await ann.json();
  scenes = ad.scenes;

  showFrame(0);
  renderSceneList();
  renderTimeline();
  document.getElementById("save-status").textContent = "저장 안 됨";
}

async function extractFrames() {
  const p = document.getElementById("video-path-input").value.trim();
  if (!p) { alert("mp4 경로를 입력하세요"); return; }
  const movieId = p.split("/").pop().replace(/\.\w+$/, "");
  document.getElementById("save-status").textContent = "추출 중...";
  const r = await fetch("/api/extract", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ video_path: p, movie_id: movieId })
  });
  const d = await r.json();
  if (d.ok) {
    // 드롭다운 갱신
    const sel = document.getElementById("movie-select");
    if (![...sel.options].find(o => o.value === movieId)) {
      const opt = document.createElement("option");
      opt.value = movieId; opt.text = movieId;
      sel.appendChild(opt);
    }
    sel.value = movieId;
    await loadMovie(movieId);
    document.getElementById("save-status").textContent = `추출 완료 (${d.count}프레임)`;
  } else {
    alert("추출 실패: " + d.error);
    document.getElementById("save-status").textContent = "추출 실패";
  }
}

// ── 프레임 표시 ────────────────────────────────────
function showFrame(idx) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, idx));
  currentIdx = idx;
  const img = document.getElementById("frame-img");
  img.src = `/api/frame/${currentMovie}/${frames[idx]}`;
  document.getElementById("frame-counter").textContent =
    `frame ${idx + 1} / ${frames.length}`;
  document.getElementById("frame-input").value = idx + 1;
  updateCursor();
}

function go(delta) {
  showFrame(currentIdx + delta);
}

function jumpToFrame(val) {
  showFrame(parseInt(val) - 1);
}

// ── 키보드 ─────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft")  { go(e.shiftKey ? -10 : -1); e.preventDefault(); }
  if (e.key === "ArrowRight") { go(e.shiftKey ?  10 :  1); e.preventDefault(); }
  if (e.key === "1") toggleLabel("violence");
  if (e.key === "2") toggleLabel("neg_hard");
  if (e.key === "Escape") cancelPending();
  if (e.key === "s" && e.ctrlKey) { e.preventDefault(); saveAnnotations(); }
});

function toggleLabel(label) {
  if (pendingLabel === label) {
    // 끝 프레임
    const sf = Math.min(pendingStart, currentIdx + 1);
    const ef = Math.max(pendingStart, currentIdx + 1);
    if (ef > sf) {
      scenes.push({ start_frame: sf, end_frame: ef, label });
      scenes.sort((a, b) => a.start_frame - b.start_frame);
    }
    pendingLabel = null; pendingStart = null;
  } else if (pendingLabel === null) {
    // 시작
    pendingLabel = label;
    pendingStart = currentIdx + 1;
  } else {
    // 다른 라벨로 교체
    pendingLabel = label;
    pendingStart = currentIdx + 1;
  }
  updateActiveLabel();
  renderSceneList();
  renderTimeline();
}

function cancelPending() {
  pendingLabel = null; pendingStart = null;
  updateActiveLabel();
}

function updateActiveLabel() {
  const el = document.getElementById("active-label-display");
  if (!pendingLabel) {
    el.textContent = "대기 중";
    el.className = "active-label label-none";
  } else {
    el.textContent = pendingLabel === "violence"
      ? `🔴 violence 시작: ${pendingStart}프레임 → 끝 프레임에서 [1]`
      : `🟠 neg_hard 시작: ${pendingStart}프레임 → 끝 프레임에서 [2]`;
    el.className = `active-label label-${pendingLabel}`;
  }
}

// ── 씬 리스트 ──────────────────────────────────────
function renderSceneList() {
  const list = document.getElementById("scene-list");
  document.getElementById("scene-count-title").textContent =
    `📋 어노테이션 — ${scenes.length}개`;
  list.innerHTML = "";
  scenes.forEach((sc, i) => {
    const div = document.createElement("div");
    div.className = "scene-item";
    div.onclick = () => showFrame(sc.start_frame - 1);
    const dotClass = sc.label === "violence" ? "dot-violence" : "dot-neg_hard";
    div.innerHTML = `
      <div class="scene-dot ${dotClass}"></div>
      <span>${sc.label}</span>
      <span style="color:#888;font-size:11px">${sc.start_frame}–${sc.end_frame}</span>
      <span class="del-btn" onclick="deleteScene(${i}, event)">✕</span>
    `;
    list.appendChild(div);
  });
}

function deleteScene(i, e) {
  e.stopPropagation();
  scenes.splice(i, 1);
  renderSceneList();
  renderTimeline();
}

// ── 타임라인 ──────────────────────────────────────
function renderTimeline() {
  const tl = document.getElementById("timeline");
  // 기존 세그먼트 제거
  tl.querySelectorAll(".tl-segment").forEach(el => el.remove());
  const total = frames.length;
  if (!total) return;

  scenes.forEach(sc => {
    const seg = document.createElement("div");
    seg.className = "tl-segment";
    seg.style.left = ((sc.start_frame - 1) / total * 100) + "%";
    seg.style.width = ((sc.end_frame - sc.start_frame + 1) / total * 100) + "%";
    seg.style.background = sc.label === "violence" ? "#cc2222" : "#cc7700";
    tl.appendChild(seg);
  });
  updateCursor();
}

function updateCursor() {
  const total = frames.length;
  if (!total) return;
  const pct = currentIdx / total * 100;
  document.getElementById("tl-cursor").style.left = pct + "%";
}

function timelineClick(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  showFrame(Math.floor(pct * frames.length));
}

// ── 저장 ──────────────────────────────────────────
async function saveAnnotations() {
  if (!currentMovie) return;
  const r = await fetch(`/api/annotations/${currentMovie}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ scenes })
  });
  const d = await r.json();
  const now = new Date().toLocaleTimeString();
  document.getElementById("save-status").textContent =
    d.ok ? `✅ 저장 완료 (${now})` : "❌ 저장 실패";
}
</script>
</body>
</html>
